name: Update APT Repository

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-repo]
  # Self-healing net. The publishers (citronics-kernel, initramfs) dispatch
  # update-repo after every release, but that hop needs a cross-repo credential
  # (APT_DISPATCH_TOKEN) and therefore has a single point of failure: when the
  # secret was unset, releases kept being published while apt silently kept
  # serving the previous index - a kernel deb sat unreachable for a day that way.
  # A daily pass costs almost nothing (the job is idempotent: it rebuilds the
  # index from the assets of every existing release) and bounds that failure to
  # 24 h instead of forever.
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: apt-repo-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (meta-package sources)
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-checkout

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: apt-repo

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Create directory structure
        working-directory: apt-repo
        run: |
          mkdir -p pool/main
          mkdir -p dists/stable/main/binary-armhf
          mkdir -p dists/stable/main/binary-all
          mkdir -p dists/stable/main/binary-arm64
          mkdir -p pool/experimental
          mkdir -p dists/stable/experimental/binary-armhf
          mkdir -p dists/stable/experimental/binary-all
          mkdir -p dists/stable/experimental/binary-arm64

      - name: Download releases from all source repos
        working-directory: apt-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS="Citronics/initramfs Citronics/linux-firmware-lime Citronics/lime-image Citronics/citronics-kernel Citronics/citronics-firmware Citronics/unudhcpd-deb Citronics/limeboard-firmware Citronics/limeboard-extras"

          mkdir -p /tmp/manifests
          for REPO in $REPOS; do
            echo "Downloading from $REPO..."
            # A failed listing must fail the run: it would silently leave
            # that repository's packages out of the index.
            TAGS=$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')
            for TAG in $TAGS; do
              # A release without .deb assets is fine, hence || true
              gh release download "$TAG" --repo "$REPO" --pattern '*.deb' --dir pool/main/ --skip-existing 2>/dev/null || true
              # Kernel releases list each package's APT component
              gh release download "$TAG" --repo "$REPO" --pattern 'components.tsv' \
                --output "/tmp/manifests/${REPO#*/}-$TAG.tsv" 2>/dev/null || true
            done
          done

          find pool/main/ pool/experimental/ -name '*-dbg_*' -delete
          find pool/main/ pool/experimental/ -name 'linux-libc-dev_*' -delete

          # Place every package in the component its release's components.tsv
          # names. Kernels from releases older than the manifest fall back to
          # the version list they were published under. A package found in
          # the wrong directory is moved, so none is listed in both.
          cat /tmp/manifests/*.tsv > /tmp/components.tsv 2>/dev/null || : > /tmp/components.tsv
          echo "Sorting packages into main and experimental..."
          for deb in pool/main/*.deb pool/experimental/*.deb; do
            [ -f "$deb" ] || continue
            f=$(basename "$deb")
            comp=$(awk -F'\t' -v f="$f" '$1 == f { print $2; exit }' /tmp/components.tsv)
            if [ -z "$comp" ]; then
              case "$f" in
                linux-image-*-citronics-lime-*|linux-headers-*-citronics-lime-*)
                  if echo "$f" | grep -qE '7\.[0-9]+\.[0-9]+-msm8953|6\.16\.[0-9]+-msm8974|6\.12\.[0-9]+-citronics-lime-fp2_'; then
                    comp=main
                  else
                    comp=experimental
                  fi ;;
                *) continue ;;
              esac
            fi
            if [ "$(dirname "$deb")" != "pool/$comp" ]; then
              echo "  $f -> $comp"
              mv -f "$deb" "pool/$comp/"
            fi
          done

          echo "Downloaded .deb files:"
          ls -la pool/main/

      - name: Build meta-packages
        working-directory: apt-repo
        run: |
          for pkg_dir in ../main-checkout/meta-packages/*/; do
            if [ -d "${pkg_dir}DEBIAN" ]; then
              pkg_name=$(grep '^Package:' "${pkg_dir}DEBIAN/control" | awk '{print $2}')
              pkg_version=$(grep '^Version:' "${pkg_dir}DEBIAN/control" | awk '{print $2}')
              pkg_arch=$(grep '^Architecture:' "${pkg_dir}DEBIAN/control" | awk '{print $2}')
              dpkg-deb --root-owner-group --build "$pkg_dir" "pool/main/${pkg_name}_${pkg_version}_${pkg_arch}.deb"
              echo "Built ${pkg_name}_${pkg_version}_${pkg_arch}.deb"
            fi
          done

      - name: Generate APT metadata
        working-directory: apt-repo
        run: |
          apt-ftparchive packages pool/main/ > /tmp/all-packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: (armhf|all)\n/' /tmp/all-packages > dists/stable/main/binary-armhf/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: (arm64|all)\n/' /tmp/all-packages > dists/stable/main/binary-arm64/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: all\n/' /tmp/all-packages > dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-armhf/Packages
          gzip -kf dists/stable/main/binary-arm64/Packages
          gzip -kf dists/stable/main/binary-all/Packages
          apt-ftparchive packages pool/experimental/ > /tmp/experimental-packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: (armhf|all)\n/' /tmp/experimental-packages > dists/stable/experimental/binary-armhf/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: (arm64|all)\n/' /tmp/experimental-packages > dists/stable/experimental/binary-arm64/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /\nArchitecture: all\n/' /tmp/experimental-packages > dists/stable/experimental/binary-all/Packages
          gzip -kf dists/stable/experimental/binary-armhf/Packages
          gzip -kf dists/stable/experimental/binary-arm64/Packages
          gzip -kf dists/stable/experimental/binary-all/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="armhf arm64 all" \
            -o APT::FTPArchive::Release::Components="main experimental" \
            release dists/stable/ > dists/stable/Release

      - name: Commit and push
        working-directory: apt-repo
        run: |
          git config user.name "Marc Lainez"
          git config user.email "marc.lainez@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update APT repository"
            git push
          fi

      - name: Trigger image build in debos-citronics
        env:
          IMAGES_DISPATCH_TOKEN: ${{ secrets.IMAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$IMAGES_DISPATCH_TOKEN" ]; then
            # A warning, not an error: the APT index - the thing devices install
            # from - was already refreshed successfully by the steps above. Only
            # the convenience rebuild of the debos images is skipped. Contrast
            # APT_DISPATCH_TOKEN in the publisher repos, whose absence *does*
            # break delivery and therefore fails the run.
            echo "::warning title=Image rebuild not triggered::IMAGES_DISPATCH_TOKEN" \
                 "is unset, so Citronics/debos-citronics was not told to rebuild" \
                 "its images. The APT repository itself IS up to date, so devices" \
                 "can apt-install the new packages; only the prebuilt images stay" \
                 "on the previous package set. Fix: fine-grained PAT (resource" \
                 "owner Citronics, repository Citronics/debos-citronics, Contents:" \
                 "read+write) as the organisation secret IMAGES_DISPATCH_TOKEN."
            exit 0
          fi
          echo "Triggering deps-updated dispatch in Citronics/debos-citronics"
          curl -s -X POST \
            -H "Authorization: Bearer $IMAGES_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Citronics/debos-citronics/dispatches \
            -d '{"event_type":"deps-updated"}'
